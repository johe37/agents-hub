<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Town</title>
<style>
  :root {
    --bg: #f4efe4; --fg: #2b2b3a; --muted: #6b6878; --line: #ddd3c0; --card: #fffaf0;
    --accent: #4f7cac; --warn: #c9871a; --danger: #c43c3c; --ok: #3f8a52; --code: #efe6d4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1f2e; --fg: #e6e2d8; --muted: #9a97a6; --line: #343a50; --card: #232840;
      --accent: #8fb3e0; --warn: #f0b545; --danger: #ef6b6b; --ok: #7cc48c; --code: #2b3150;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: flex; height: 100%; }
  #stage { position: relative; flex: 1; min-width: 0; overflow: hidden; background: #6a9c58;
    cursor: grab; touch-action: none; }
  #stage.dragging { cursor: grabbing; }
  #stage.pointing { cursor: pointer; }
  canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  .overlay { position: absolute; z-index: 2; }
  #counter { top: 12px; right: 12px; border: 0; border-radius: 6px; padding: 7px 12px; font: inherit;
    font-weight: 600; background: var(--card); color: var(--fg); box-shadow: 0 1px 4px #0004; cursor: pointer; }
  #counter.hot { background: #ffd23f; color: #2b2b3a; }
  #counter:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #badges { top: 12px; left: 12px; display: flex; gap: 6px; }
  .badge { background: var(--card); color: var(--muted); border-radius: 6px; padding: 4px 9px; font-size: 12px;
    box-shadow: 0 1px 4px #0003; }
  #help { bottom: 10px; left: 12px; font-size: 12px; color: #fff; text-shadow: 0 1px 2px #0008; pointer-events: none; }
  #tip { pointer-events: none; background: var(--card); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; font-size: 12.5px; max-width: 320px; box-shadow: 0 2px 8px #0004; }
  #tip b { display: block; font-size: 13.5px; }
  #tip .dim { color: var(--muted); }

  #panel { width: 400px; max-width: 100%; border-left: 1px solid var(--line); background: var(--bg);
    display: flex; flex-direction: column; min-height: 0; }
  #panel-head { display: flex; align-items: flex-start; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  #panel-head h2 { margin: 0; font-size: 16px; flex: 1; overflow-wrap: anywhere; }
  #panel-head .sub { font-size: 12px; color: var(--muted); font-weight: normal; display: block; margin-top: 2px; }
  #close { border: 0; background: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; padding: 0 2px; }
  #panel-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
  #panel-body section { margin-bottom: 16px; }
  #panel-body h3 { margin: 0 0 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .chip { display: inline-block; border-radius: 4px; padding: 1px 7px; font-size: 12px; font-weight: 600; }
  .chip.permission { background: var(--danger); color: #fff; }
  .chip.waiting { background: var(--warn); color: #2b2b3a; }
  .chip.working { background: var(--accent); color: #fff; }
  .chip.idle { background: var(--ok); color: #fff; }
  .chip.asleep { background: var(--line); color: var(--muted); }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--card); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; max-height: 260px; overflow-y: auto; }
  pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.4 ui-monospace, "JetBrains Mono", monospace;
    background: var(--code); border-radius: 6px; padding: 8px 10px; max-height: 260px; overflow-y: auto; }
  .call { border: 2px solid var(--danger); border-radius: 8px; padding: 10px; background: var(--card); }
  .call .name { font-weight: 600; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .meta { color: var(--muted); font-size: 12.5px; }
  ul.files { list-style: none; margin: 0; padding: 0; font: 12.5px/1.5 ui-monospace, monospace; }
  ul.files li { overflow-wrap: anywhere; }
  ul.files .st { display: inline-block; width: 2.4em; color: var(--warn); }
  ul.links { list-style: none; margin: 0; padding: 0; }
  ul.links button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px 0; font: inherit; text-align: left; }
  button.act { border: 0; border-radius: 6px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  button.act:disabled { opacity: .5; cursor: not-allowed; }
  .approve { background: var(--ok); color: #fff; }
  .deny { background: var(--danger); color: #fff; }
  .send { background: var(--accent); color: #fff; }
  #reply { border-top: 1px solid var(--line); padding: 10px 16px 14px; }
  #reply textarea { width: 100%; resize: vertical; min-height: 54px; font: inherit; padding: 7px 9px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg); margin-bottom: 8px; }
  #reply .row { align-items: center; justify-content: space-between; }
  #note { font-size: 12.5px; min-height: 1.2em; }
  #note.err { color: var(--danger); }
  #note.ok { color: var(--ok); }
  [hidden] { display: none !important; }

  @media (max-width: 760px) {
    #app { flex-direction: column; }
    #panel { width: 100%; height: 50%; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="town" aria-label="Pixel art town with your workspaces as houses and your Claude agents as people"></canvas>
    <div id="badges" class="overlay"><span id="conn" class="badge" hidden>Reconnecting…</span><span id="demo" class="badge" hidden>Demo town</span></div>
    <button id="counter" class="overlay" type="button">Loading the town…</button>
    <div id="tip" class="overlay" hidden></div>
    <div id="help" class="overlay">Drag to move · scroll to zoom · click a house or a person</div>
  </div>
  <aside id="panel" hidden>
    <div id="panel-head"><h2 id="panel-title"></h2><button id="close" type="button" aria-label="Close panel">×</button></div>
    <div id="panel-body"></div>
    <form id="reply" hidden>
      <textarea id="reply-text" placeholder="Reply to the agent…" maxlength="4000"></textarea>
      <div class="row"><span id="note"></span><button class="act send" type="submit">Send</button></div>
    </form>
  </aside>
</div>
<script src="/town.js"></script>
</body>
</html>
