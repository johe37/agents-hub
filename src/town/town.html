<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Town</title>
<style>
  /* The panel takes the hub's theme colours, set from the model; these are only first-paint defaults. */
  :root {
    --bg: #1F1F1F; --bar: #181818; --border: #2B2B2B; --fg: #CCCCCC; --bright: #FFFFFF; --muted: #9D9D9D;
    --dim: #6E7681; --accent: #0078D4; --panel: #252526; --input: #313131; --error: #F85149; --success: #2EA043;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bar); color: var(--fg);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: flex; height: 100%; }
  #stage { position: relative; flex: 1; min-width: 0; overflow: hidden; background: #6a9c58; cursor: grab; touch-action: none; }
  #stage.dragging { cursor: grabbing; }
  #stage.pointing { cursor: pointer; }
  /* Only the town map is pinned to the corner; icons, the doll and the XP bar are placed by their own rules. */
  #town { position: absolute; left: 0; top: 0; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  .overlay { position: absolute; z-index: 2; }
  #counter { top: 12px; right: 12px; border: 0; border-radius: 6px; padding: 7px 12px; font: inherit; font-weight: 600;
    background: var(--panel); color: var(--fg); box-shadow: 0 1px 4px #0006; cursor: pointer; }
  #counter.hot { background: #ffd23f; color: #2b2b3a; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #badges { top: 12px; left: 12px; display: flex; gap: 6px; }
  .badge { background: var(--panel); color: var(--muted); border-radius: 6px; padding: 4px 9px; font-size: 12px; box-shadow: 0 1px 4px #0005; }
  #help { bottom: 10px; left: 12px; max-width: calc(50% - 275px); font-size: 12px; color: #fff; text-shadow: 0 1px 2px #0008; pointer-events: none; }
  #tip { pointer-events: none; background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font-size: 12.5px; max-width: 340px; box-shadow: 0 2px 8px #0006; }
  #tip b { display: block; font-size: 13.5px; color: var(--bright); }
  #tip .dim { color: var(--muted); }

  /* ---- The hub's detail panel, drawn like the terminal: monospace, its colours, its layout. */
  #panel { width: 46em; max-width: 100%; background: var(--bar); padding: 6px; display: flex; min-height: 0;
    font: 13px/1.35 "JetBrains Mono", "Fira Code", ui-monospace, "Cascadia Mono", Menlo, monospace; }
  .box { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); padding: 10px 10px 12px; }
  .box > .btitle { position: absolute; top: -0.75em; left: 10px; background: var(--bg); padding: 0 0.5ch; color: var(--bright); font-weight: 700;
    max-width: calc(100% - 4ch); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .box > .bmeta { position: absolute; bottom: -0.75em; right: 10px; background: var(--bg); padding: 0 0.5ch;
    max-width: calc(100% - 4ch); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .close { position: absolute; top: -0.85em; right: 10px; background: var(--bg); color: var(--muted); border: 0; font: inherit; cursor: pointer; padding: 0 0.5ch; }
  .tl { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.35em; }
  .walk { border: 1px dashed var(--accent); border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; color: var(--fg); }
  .walk b { color: var(--bright); }
  .banner { border-left: 3px solid; padding: 1.35em 1ch; margin: 2px 0 1.35em; }
  .buttons { display: flex; flex-wrap: wrap; gap: 0 2ch; margin-top: 1.35em; }
  .btn { border: 0; background: none; padding: 0; font: inherit; color: var(--muted); cursor: pointer; }
  .btn .key { font-weight: 700; padding: 0 1ch; margin-right: 1ch; }
  .btn:disabled { cursor: not-allowed; opacity: 0.6; }
  .tabs { display: flex; flex-wrap: wrap; gap: 0 1ch; border-bottom: 1px solid var(--border); margin-bottom: 1.35em; }
  .tab { border: 0; background: none; font: inherit; color: var(--muted); padding: 0 1ch 2px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.on { color: var(--bright); font-weight: 700; border-bottom-color: var(--accent); }
  .tab .n { color: var(--dim); font-weight: normal; }
  .tab.on .n { color: var(--accent); }
  .body { flex: 1; overflow-y: auto; min-height: 4em; }
  .reply { margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); position: relative; padding: 8px 1ch 4px; }
  .reply.on { border-color: var(--accent); }
  .reply .rtitle { position: absolute; top: -0.75em; left: 1ch; background: var(--panel); padding: 0 0.5ch; color: var(--muted); }
  .reply.on .rtitle { color: var(--bright); }
  .reply input { width: 100%; border: 0; background: transparent; color: var(--bright); font: inherit; outline: none; }
  .reply input::placeholder { color: var(--dim); }
  .note { min-height: 1.35em; margin-top: 4px; color: var(--muted); }
  .note.err { color: var(--error); }
  .note.ok { color: var(--success); }
  [hidden] { display: none !important; }

  /* ---- You: the dock on the left (character, bag, quests), the XP bar, loot and the character maker. */
  #app { position: relative; }
  #dock { display: flex; flex: none; min-height: 0; z-index: 4; }
  #dock-strip { width: 44px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0;
    background: var(--bar); border-right: 1px solid var(--border); }
  .dtab { width: 34px; height: 34px; border: 1px solid transparent; border-radius: 6px; background: none; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .dtab:hover { background: var(--panel); }
  .dtab.on { background: var(--panel); border-color: var(--accent); }
  .dtab canvas { width: 24px; height: 24px; image-rendering: pixelated; }
  .dlevel { margin-top: 10px; font-weight: 700; color: #ffd23f; font-size: 13px; }
  .dvbar { width: 6px; height: 120px; background: var(--input); border-radius: 3px; position: relative; overflow: hidden; }
  .dvbar > i { position: absolute; left: 0; right: 0; bottom: 0; background: #8a6bff; }
  #dock-body { width: 400px; max-width: calc(100vw - 60px); overflow-y: auto; overflow-x: hidden; padding: 14px 16px 24px; background: var(--bg); border-right: 1px solid var(--border); }
  #dock.over #dock-body { position: absolute; left: 44px; top: 0; bottom: 0; box-shadow: 6px 0 18px #0009; }
  .dname { font-size: 17px; font-weight: 700; color: var(--bright); }
  .dlv { color: #ffd23f; font-size: 14px; }
  .dxp { height: 10px; margin: 8px 0 3px; background: #2b2b3a; border: 2px solid #1b1b28; position: relative; }
  .dxp > i { position: absolute; left: 0; top: 0; bottom: 0; background: repeating-linear-gradient(90deg, #8a6bff 0 7px, #7a5bef 7px 8px); }
  .dxpt, .dhint, .qm { font-size: 12px; color: var(--muted); }
  .dsub { margin: 18px 0 8px; font-weight: 700; color: var(--bright); }
  .frameholder { margin: 16px auto 0; }
  .frame { position: relative; transform-origin: 0 0; }
  .frame > * { position: absolute; }
  #doll { width: 192px; height: 264px; image-rendering: pixelated; cursor: pointer;
    background: radial-gradient(ellipse at 50% 72%, #ffffff14, transparent 60%); border-radius: 8px; }
  .slot, .cell { width: 48px; height: 48px; border: 2px solid var(--border); border-radius: 6px; background: #15151f; display: grid; place-items: center; }
  .slot { z-index: 1; }
  .slot[draggable="true"], .cell[draggable="true"] { cursor: grab; }
  .slot .ph { color: var(--dim); font-size: 9.5px; line-height: 1.05; text-align: center; padding: 2px; }
  .slot.valid { border-color: #ffd23f !important; box-shadow: 0 0 0 3px #ffd23f55; }
  .slot.invalid { opacity: 0.35; }
  .classbox { margin: 10px 0 4px; padding: 8px 10px; background: var(--panel); border-radius: 6px; border-left: 3px solid #b155ff; }
  .cname2 { font-weight: 700; color: var(--bright); }
  .cflavor { font-size: 12px; color: var(--muted); font-style: italic; }
  .cstand { margin-top: 6px; font-size: 12px; }
  .crow2 { display: flex; justify-content: space-between; color: var(--muted); }
  .crow2.on { color: var(--bright); font-weight: 600; }
  .cn { color: var(--dim); }
  .legend { box-shadow: 0 0 10px #ff9a1f88; }
  .icon { image-rendering: pixelated; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 18px; margin: 14px 0 6px; padding: 8px 10px; background: var(--panel); border-radius: 6px; }
  .stat { display: flex; gap: 6px; } .stat .sl { color: var(--muted); flex: 1; } .stat .sv { color: var(--bright); font-weight: 700; }
  .up { color: #3ccf4e; font-weight: 700; } .down { color: #f85149; font-weight: 700; }
  .linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px 0; font: inherit; font-size: 12.5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, 48px); gap: 6px; padding: 4px; border-radius: 6px; }
  .grid.drop { outline: 2px dashed #ffd23f; }
  .cell.empty { opacity: 0.45; }
  .dhint { margin-top: 8px; }
  .quest { padding: 10px 12px; margin-bottom: 8px; background: var(--panel); border-radius: 6px; border-left: 3px solid #ffd23f; }
  .qt { color: var(--bright); font-weight: 600; text-decoration: none; } a.qt:hover { text-decoration: underline; }
  .qr { margin-top: 4px; font-size: 12.5px; color: var(--muted); } .qr b { color: #ffd23f; } .qdue { color: var(--warning, #d29922); }
  .qlabels { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .qlabel { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--input); color: var(--muted); }
  .done { font-size: 12.5px; padding: 3px 0; } .done .dx { color: #8a6bff; font-weight: 700; }
  .quest-line { color: #ffd23f; }
  #xpbar { bottom: 10px; left: 50%; transform: translateX(-50%); image-rendering: pixelated; cursor: pointer; }
  #itip { position: fixed; z-index: 30; pointer-events: none; background: #0d0f1af2; border: 1px solid #5a5f7a; border-radius: 4px;
    padding: 8px 11px; min-width: 220px; max-width: 300px; font: 13px/1.4 system-ui, sans-serif; color: #fff; box-shadow: 0 4px 14px #000a; }
  #itip .n { font-weight: 700; font-size: 14.5px; } #itip .row { display: flex; justify-content: space-between; gap: 12px; }
  #itip .lvl { color: #ffd23f; } #itip .rar { color: #9d9d9d; font-size: 12px; } #itip .cmp { margin-top: 4px; font-size: 12px; color: #ccc; }
  .fl { color: #ffd27a; font-style: italic; margin-top: 6px; }
  .grows { color: #ff9a1f; font-size: 12px; }
  .src { color: #9d9d9d; margin-top: 6px; font-size: 12px; }
  #toast { top: 56px; left: 50%; transform: translateX(-50%); background: #1b1b28f0; border: 2px solid #ffd23f; color: #fff;
    padding: 8px 14px; border-radius: 6px; font-weight: 600; max-width: 80%; z-index: 6; pointer-events: none; }
  #toast.err { border-color: var(--error); }
  .modal { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: #0008; }
  .lootcard { background: #0d0f1a; color: #fff; border: 2px solid #5a5f7a; border-radius: 10px; padding: 18px 24px; min-width: 300px; max-width: 380px;
    text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .lvbanner { width: 256px; height: 36px; image-rendering: pixelated; }
  .lsub { color: #9d9d9d; font-size: 12px; margin-top: 6px; }
  .icon.drop { animation: drop 0.6s cubic-bezier(.3,1.6,.6,1); margin: 6px 0; }
  @keyframes drop { from { transform: translateY(-40px) scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .ln { font-size: 17px; font-weight: 700; } .lk { color: #ccc; font-size: 12.5px; } .lstats { color: #fff; font-size: 13px; }
  .lbtns { display: flex; gap: 10px; margin-top: 12px; }
  .lbtn { border: 1px solid #5a5f7a; background: #1f2233; color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font: inherit; }
  .lbtn.main { background: #ffd23f; color: #1b1b28; border-color: #ffd23f; font-weight: 700; }
  .creator { gap: 10px; }
  .cprev { width: 144px; height: 198px; image-rendering: pixelated; background: radial-gradient(ellipse at 50% 72%, #ffffff18, transparent 60%); }
  .cname { background: #1f2233; border: 1px solid #5a5f7a; color: #fff; border-radius: 6px; padding: 5px 8px; font: inherit; text-align: center; width: 200px; }
  .crow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 5px; }
  .cl { width: 52px; text-align: right; color: #9d9d9d; font-size: 12px; margin-right: 4px; }
  .sw { width: 20px; height: 20px; border-radius: 4px; border: 2px solid #0d0f1a; cursor: pointer; padding: 0; }
  .sw.on { border-color: #fff; }
  .chip { border: 1px solid #5a5f7a; background: #1f2233; color: #ccc; border-radius: 10px; padding: 1px 8px; font-size: 12px; cursor: pointer; }
  .chip.on { background: #ffd23f; color: #1b1b28; border-color: #ffd23f; }

  .newbtn { border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; color: var(--bright); background: var(--accent); }
  .pkcard { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; width: min(560px, 92%);
    box-shadow: 0 8px 30px #000a; font: 13px/1.4 "JetBrains Mono", "Fira Code", ui-monospace, Menlo, monospace; }
  .pktitle { font-weight: 700; color: var(--bright); margin-bottom: 8px; }
  #pk-q, #pk-task { width: 100%; background: var(--panel); color: var(--bright); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; font: inherit; outline: none; }
  #pk-q:focus, #pk-task:focus { border-color: var(--accent); }
  #pk-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 46vh; overflow-y: auto; }
  #pk-list li { padding: 3px 8px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; white-space: nowrap; }
  #pk-list li .t { color: var(--dim); }
  #pk-list li.on { background: var(--input); color: var(--bright); }
  #pk-list li.on .t { color: var(--accent); }
  #pk-chosen { margin: 8px 0; color: var(--bright); }
  #pk-chosen b { color: var(--accent); }
  .pkhint { margin-top: 8px; color: var(--dim); font-size: 12px; }
  @media (max-width: 1100px) { #help { display: none; } }
  @media (max-width: 800px) {
    #app { flex-direction: column; }
    #panel { width: 100%; height: 55%; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="dock" aria-label="Your character, bag and quests">
    <nav id="dock-strip"></nav>
    <section id="dock-body" hidden></section>
  </aside>
  <div id="stage">
    <canvas id="town" aria-label="Pixel art town: each repo is a shop, each Claude agent works in one"></canvas>
    <div id="badges" class="overlay"><button id="newclaude" class="badge newbtn" type="button" title="Start Claude in any repo or folder (c or n)">+ New Claude</button><span id="conn" class="badge" hidden>Reconnecting…</span><span id="demo" class="badge" hidden>Demo town</span></div>
    <button id="counter" class="overlay" type="button">Loading the town…</button>
    <div id="tip" class="overlay" hidden></div>
    <div id="help" class="overlay">Drag to move · scroll to zoom · click a shop, a person or yourself · c new Claude · p i q: character, bag, quests</div>
    <canvas id="xpbar" class="overlay" aria-label="Your level and XP"></canvas>
    <div id="toast" class="overlay" role="status" hidden></div>
    <div id="loot" class="modal" role="dialog" aria-label="Level up" hidden></div>
    <div id="creator" class="modal" role="dialog" aria-label="Make your character" hidden></div>
    <div id="picker" class="modal" role="dialog" aria-label="Start Claude somewhere" hidden>
      <form id="pk-form" class="pkcard">
        <div class="pktitle">New Claude</div>
        <input id="pk-q" autocomplete="off" spellcheck="false" placeholder="Search repos and folders, or type a path (~/, /)" aria-label="Where">
        <ul id="pk-list" role="listbox"></ul>
        <div id="pk-chosen" hidden></div>
        <input id="pk-task" autocomplete="off" maxlength="4000" placeholder="First task for Claude (optional)" aria-label="First task" hidden>
        <div class="pkhint" id="pk-hint">↑ ↓ choose · Enter picks the place · Esc closes</div>
        <div class="note" id="pk-note"></div>
      </form>
    </div>
  </div>
  <aside id="panel" hidden>
    <div class="box">
      <span class="btitle" id="p-title"></span>
      <button class="close" id="p-close" type="button" aria-label="Close panel">[×]</button>
      <div id="p-walk" class="walk" hidden></div>
      <div id="p-banner" class="banner"></div>
      <div id="p-tabs" class="tabs" role="tablist"></div>
      <div id="p-body" class="body"></div>
      <form id="p-reply" class="reply" hidden>
        <span class="rtitle"> Reply </span>
        <input id="p-input" maxlength="4000" autocomplete="off">
      </form>
      <div id="p-note" class="note"></div>
      <span class="bmeta" id="p-meta"></span>
    </div>
  </aside>
</div>
<div id="itip" hidden></div>
<script src="/player.js"></script>
<script src="/town.js"></script>
</body>
</html>
