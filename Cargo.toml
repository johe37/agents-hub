[package]
name = "jugglr"
version = "0.9.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
mime_guess = "2.0.5"
portable-pty = "0.9.0"
ratatui = "0.30.2"
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
toml = "1.2.1"
unicode-width = "0.2"
vt100 = "0.18.1"
