name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  # Run by hand to create the releases that are missing, e.g. for tags pushed before this workflow.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # checkout fetches tags without their annotation, which holds the release notes.
      - run: git fetch --force --tags origin
      - name: Create the GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' --sort=v:refname)
          newest=$(echo "$versions" | tail -n 1)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tags=$GITHUB_REF_NAME
          else
            have=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
            tags=$(echo "$versions" | grep -vxF -f <(echo "$have") || true)
          fi
          for tag in $tags; do
            git tag -l --format='%(contents:body)' "$tag" > notes.md
            if grep -q '[^[:space:]]' notes.md; then
              notes=(--notes-file notes.md)
            else
              notes=(--generate-notes)
            fi
            latest=$([ "$tag" = "$newest" ] && echo true || echo false)
            gh release create "$tag" --verify-tag --title "$tag" --latest="$latest" "${notes[@]}"
          done
